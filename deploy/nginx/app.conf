# http · https 두 모드가 같이 쓰는 부분 (화면 파일 + /api 전달)
# 화면과 API 를 같은 주소에서 내보냄 → CORS 없이 로그인 쿠키가 그대로 동작 (시스템 구조 1장)

client_max_body_size 10m;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

# ---------- API ----------
location /api/ {
    proxy_pass http://server:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# actuator 는 health 만 밖에서 보이게 (시스템 구조 5-3)
location = /actuator/health {
    proxy_pass http://server:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location /actuator/ {
    return 404;
}

# ---------- 화면 (React 빌드 파일) ----------
root /usr/share/nginx/html;

# 파일 이름에 해시가 붙은 것은 1년 캐시
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# 새 버전을 바로 알아채야 하는 파일은 캐시하지 않음 (업데이트 알림 UpdatePrompt)
location ~ ^/(sw\.js|registerSW\.js|workbox-[^/]+\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}

# 나머지 주소는 React Router 가 처리 → index.html
location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
}
