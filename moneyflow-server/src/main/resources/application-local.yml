# local: 내 PC에서 빠르게. H2 메모리 DB를 MySQL 모드로 (껐다 켜면 데이터가 사라짐)
spring:
  datasource:
    url: jdbc:h2:mem:moneyflow;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    org.hibernate.SQL: debug
