# prod: 운영 서버. 값은 서버의 .env에서만 넣는다 (저장소에 올리지 않음)
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

server:
  # nginx 뒤에서 HTTPS를 알아보기 위해
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        # HTTPS 에서만 쿠키를 보냄. 인증서 받기 전(http 모드)에만 .env 에서 false 로 (deploy/README.md)
        secure: ${COOKIE_SECURE:true}
